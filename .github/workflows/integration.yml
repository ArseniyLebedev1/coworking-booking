name: Integration Tests
on:
  push:
  pull_request:
jobs:
  docker-integration:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start services
        run: docker compose up --build -d
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 5
          done
          docker compose logs --no-color
          exit 1
      - name: Test registration, JWT and booking
        run: docker compose exec -T backend python -m pytest -q tests/test_integration.py tests/test_features_integration.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v
