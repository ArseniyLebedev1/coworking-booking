name: Integration Tests

on:
  push:
  pull_request:

jobs:
  docker-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build -d

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              http://localhost:8000/health \
              | grep -q '"status":"ok"'; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend: $attempt/60"
            sleep 5
          done

          echo "Backend did not become healthy"
          exit 1

      - name: Verify seed data
        run: |
          docker compose exec -T backend \
            python -c "
          from sqlalchemy import select, func
          from app.database import SessionLocal
          from app.models import Role, Location, Room, Amenity

          expected = [
              (Role, 3),
              (Location, 2),
              (Room, 3),
              (Amenity, 4),
          ]

          with SessionLocal() as db:
              for model, minimum in expected:
                  count = db.scalar(
                      select(func.count()).select_from(model)
                  )
                  print(model.__tablename__, count)
                  assert count >= minimum, (
                      f'{model.__tablename__}: '
                      f'expected at least {minimum}, got {count}'
                  )

          print('Seed data verification passed')
          "

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
