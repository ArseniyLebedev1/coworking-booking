name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-jwt-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pyyaml openapi-spec-validator
      - run: python -m compileall -q backend
      - run: python -m openapi_spec_validator docs/openapi.yaml
      - name: Run backend unit tests
        run: python -m pytest -q tests/test_core.py tests/test_features.py
        working-directory: backend
      - name: Validate Docker Compose
        run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
