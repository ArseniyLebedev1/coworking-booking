
services:
  db:
    image: postgres:16-alpine
    container_name: coworking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coworking}
      POSTGRES_USER: ${POSTGRES_USER:-coworking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: coworking_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://coworking:dev_password@db:5432/coworking
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

