openapi: 3.0.3

info:
  title: Coworking Booking API
  description: |
    REST API платформы бронирования
    переговорных комнат и коворкингов.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Локальный сервер FastAPI

tags:
  - name: Auth
    description: Регистрация и авторизация
  - name: Users
    description: Управление пользователями
  - name: Locations
    description: Управление коворкингами
  - name: Rooms
    description: Управление помещениями
  - name: Bookings
    description: Управление бронированиями
  - name: Amenities
    description: Управление удобствами


paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация пользователя
      description: Создание учётной записи сотрудника
      operationId: registerUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  format: password
                full_name:
                  type: string
                  minLength: 1
                  example: Иван Иванов

      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                  role:
                    type: string
                    example: employee

        '400':
          description: Некорректные данные

        '409':
          description: Пользователь с таким email уже существует

        '422':
          description: Ошибка валидации данных


  /auth/login:
    post:
      tags:
        - Auth
      summary: Авторизация пользователя
      description: Проверка email и пароля, выдача JWT
      operationId: loginUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password

      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - refresh_token
                  - token_type
                properties:
                  access_token:
                    type: string
                    description: JWT для доступа к API
                  refresh_token:
                    type: string
                    description: Токен обновления доступа
                  token_type:
                    type: string
                    example: bearer

        '401':
          description: Неверный email или пароль

        '403':
          description: Учётная запись заблокирована

        '422':
          description: Ошибка валидации данных

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Обновление JWT-токенов
      description: |
        Выдаёт новую пару токенов по действительному
        refresh token.
      operationId: refreshToken

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: Действующий refresh token

      responses:
        '200':
          description: Токены успешно обновлены
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - refresh_token
                  - token_type
                properties:
                  access_token:
                    type: string
                    description: Новый JWT access token
                  refresh_token:
                    type: string
                    description: Новый JWT refresh token
                  token_type:
                    type: string
                    example: bearer

        '401':
          description: |
            Refresh token недействителен,
            отозван или срок его действия истёк.

        '403':
          description: Учётная запись заблокирована

        '422':
          description: Ошибка валидации данных


  /auth/logout:
    post:
      tags:
        - Auth
      summary: Выход из системы
      description: |
        Отзывает refresh token пользователя,
        чтобы его нельзя было использовать повторно.
      operationId: logoutUser

      security:
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: Refresh token для отзыва

      responses:
        '204':
          description: Выход выполнен успешно

        '401':
          description: Пользователь не авторизован

        '422':
          description: Ошибка валидации данных

          
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Запрос восстановления пароля
      description: |
        Принимает email пользователя и создаёт
        одноразовый токен восстановления пароля.

        Для учебного проекта ссылка восстановления
        выводится в лог сервера вместо отправки email.
        Токен нельзя записывать в публичные логи
        рабочего окружения.
      operationId: forgotPassword

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com

      responses:
        '200':
          description: |
            Запрос обработан. Ответ одинаковый
            для существующего и неизвестного email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Если аккаунт существует, инструкция отправлена

        '422':
          description: Ошибка валидации данных


  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Установка нового пароля
      description: |
        Проверяет одноразовый токен восстановления
        и устанавливает новый пароль пользователя.
        После успешного сброса токен становится
        недействительным.
      operationId: resetPassword

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                  description: Одноразовый токен восстановления
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  description: Новый пароль пользователя

      responses:
        '200':
          description: Пароль успешно изменён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Пароль успешно изменён

        '400':
          description: |
            Токен недействителен, уже использован
            или срок его действия истёк.

        '422':
          description: Ошибка валидации данных


  /users/me:
    get:
      tags:
        - Users
      summary: Получение профиля пользователя
      description: |
        Возвращает информацию о текущем
        авторизованном пользователе.
      operationId: getCurrentUser

      security:
        - BearerAuth: []

      responses:
        '200':
          description: Профиль успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                  - full_name
                  - role
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                  role:
                    type: string
                    enum:
                      - guest
                      - employee
                      - admin
                  created_at:
                    type: string
                    format: date-time

        '401':
          description: |
            Пользователь не авторизован
            или access token недействителен.

        '403':
          description: Учётная запись заблокирована


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
