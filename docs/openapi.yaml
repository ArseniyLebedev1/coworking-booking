openapi: 3.0.3

info:
  title: Coworking Booking API
  description: |
    REST API платформы бронирования
    переговорных комнат и коворкингов.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Локальный сервер FastAPI

tags:
  - name: Auth
    description: Регистрация и авторизация
  - name: Users
    description: Управление пользователями
  - name: Locations
    description: Управление коворкингами
  - name: Rooms
    description: Управление помещениями
  - name: Bookings
    description: Управление бронированиями
  - name: Amenities
    description: Управление удобствами


paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация пользователя
      description: Создание учётной записи сотрудника
      operationId: registerUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  format: password
                full_name:
                  type: string
                  minLength: 1
                  example: Иван Иванов

      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                  role:
                    type: string
                    example: employee

        '400':
          description: Некорректные данные

        '409':
          description: Пользователь с таким email уже существует

        '422':
          description: Ошибка валидации данных


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
