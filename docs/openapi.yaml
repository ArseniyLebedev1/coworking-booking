openapi: 3.0.3
info:
  title: Coworking Booking API
  description: 'REST API платформы бронирования

    переговорных комнат и коворкингов.

    '
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Локальный сервер FastAPI
tags:
- name: Auth
  description: Регистрация и авторизация
- name: Users
  description: Управление пользователями
- name: Locations
  description: Управление коворкингами
- name: Rooms
  description: Управление помещениями
- name: Bookings
  description: Управление бронированиями
- name: Amenities
  description: Управление удобствами
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Регистрация пользователя
      description: Создание учётной записи сотрудника
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - full_name
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  format: password
                full_name:
                  type: string
                  minLength: 1
                  example: Иван Иванов
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                  role:
                    type: string
                    example: employee
        '400':
          description: Некорректные данные
        '409':
          description: Пользователь с таким email уже существует
        '422':
          description: Ошибка валидации данных
  /auth/login:
    post:
      tags:
      - Auth
      summary: Авторизация пользователя
      description: Проверка email и пароля, выдача JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - refresh_token
                - token_type
                properties:
                  access_token:
                    type: string
                    description: JWT для доступа к API
                  refresh_token:
                    type: string
                    description: Токен обновления доступа
                  token_type:
                    type: string
                    example: bearer
        '401':
          description: Неверный email или пароль
        '403':
          description: Учётная запись заблокирована
        '422':
          description: Ошибка валидации данных
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Обновление JWT-токенов
      description: 'Выдаёт новую пару токенов по действительному

        refresh token.

        '
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: Действующий refresh token
      responses:
        '200':
          description: Токены успешно обновлены
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - refresh_token
                - token_type
                properties:
                  access_token:
                    type: string
                    description: Новый JWT access token
                  refresh_token:
                    type: string
                    description: Новый JWT refresh token
                  token_type:
                    type: string
                    example: bearer
        '401':
          description: 'Refresh token недействителен,

            отозван или срок его действия истёк.

            '
        '403':
          description: Учётная запись заблокирована
        '422':
          description: Ошибка валидации данных
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Выход из системы
      description: 'Отзывает refresh token пользователя,

        чтобы его нельзя было использовать повторно.

        '
      operationId: logoutUser
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: Refresh token для отзыва
      responses:
        '204':
          description: Выход выполнен успешно
        '401':
          description: Пользователь не авторизован
        '422':
          description: Ошибка валидации данных
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Запрос восстановления пароля
      description: 'Принимает email пользователя и создаёт

        одноразовый токен восстановления пароля.


        Для учебного проекта ссылка восстановления

        выводится в лог сервера вместо отправки email.

        Токен нельзя записывать в публичные логи

        рабочего окружения.

        '
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: 'Запрос обработан. Ответ одинаковый

            для существующего и неизвестного email.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Если аккаунт существует, инструкция отправлена
        '422':
          description: Ошибка валидации данных
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Установка нового пароля
      description: 'Проверяет одноразовый токен восстановления

        и устанавливает новый пароль пользователя.

        После успешного сброса токен становится

        недействительным.

        '
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - new_password
              properties:
                token:
                  type: string
                  description: Одноразовый токен восстановления
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  description: Новый пароль пользователя
      responses:
        '200':
          description: Пароль успешно изменён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Пароль успешно изменён
        '400':
          description: 'Токен недействителен, уже использован

            или срок его действия истёк.

            '
        '422':
          description: Ошибка валидации данных
  /users/me:
    get:
      tags:
      - Users
      summary: Получение профиля пользователя
      description: Возвращает данные текущего пользователя
      operationId: getCurrentUser
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Профиль успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - email
                - full_name
                - role
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                  role:
                    type: string
                    enum:
                    - guest
                    - employee
                    - admin
                  created_at:
                    type: string
                    format: date-time
        '401':
          description: Пользователь не авторизован
        '403':
          description: Учётная запись заблокирована
    patch:
      tags:
      - Users
      summary: Редактирование профиля
      description: Изменяет имя текущего пользователя
      operationId: updateCurrentUser
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Иван Петров
      responses:
        '200':
          description: Профиль успешно обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                  role:
                    type: string
                    enum:
                    - guest
                    - employee
                    - admin
        '401':
          description: Пользователь не авторизован
        '403':
          description: Учётная запись заблокирована
        '422':
          description: Ошибка валидации данных
  /users/me/password:
    patch:
      tags:
      - Users
      summary: Смена пароля пользователя
      description: 'Изменяет пароль текущего авторизованного

        пользователя после проверки старого пароля.

        '
      operationId: changeCurrentUserPassword
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              additionalProperties: false
              properties:
                current_password:
                  type: string
                  format: password
                  description: Текущий пароль
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  description: Новый пароль
      responses:
        '204':
          description: Пароль успешно изменён
        '400':
          description: Неверный текущий пароль
        '401':
          description: Пользователь не авторизован
        '403':
          description: Учётная запись заблокирована
        '422':
          description: Ошибка валидации данных
  /users:
    get:
      tags:
      - Users
      summary: Получение списка пользователей
      description: 'Возвращает список пользователей с пагинацией,

        поиском и фильтрацией.

        Доступ разрешён только администратору.

        '
      operationId: getUsers
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        description: Номер страницы
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: Количество записей на странице
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: search
        in: query
        description: Поиск по email или имени
        schema:
          type: string
      - name: role
        in: query
        description: Фильтрация по роли
        schema:
          type: string
          enum:
          - guest
          - employee
          - admin
      responses:
        '200':
          description: Список пользователей получен
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        full_name:
                          type: string
                        role:
                          type: string
                        is_blocked:
                          type: boolean
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав доступа
        '422':
          description: Ошибка валидации параметров
  /users/{user_id}:
    patch:
      tags:
      - Users
      summary: Управление пользователем
      description: 'Позволяет администратору изменять роль

        пользователя и статус блокировки.

        Доступ только для роли admin.

        '
      operationId: updateUserByAdmin
      security:
      - BearerAuth: []
      parameters:
      - name: user_id
        in: path
        required: true
        description: UUID пользователя
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                role:
                  type: string
                  enum:
                  - guest
                  - employee
                  - admin
                is_blocked:
                  type: boolean
      responses:
        '200':
          description: Данные пользователя обновлены
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  full_name:
                    type: string
                  role:
                    type: string
                  is_blocked:
                    type: boolean
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав доступа
        '404':
          description: Пользователь не найден
        '422':
          description: Ошибка валидации данных
  /locations:
    get:
      tags:
      - Locations
      summary: Получение списка коворкингов
      description: 'Возвращает список коворкингов с пагинацией,

        поиском, фильтрацией и сортировкой.

        Доступен без авторизации.

        '
      operationId: getLocations
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: search
        in: query
        description: Поиск по названию или адресу
        schema:
          type: string
      - name: city
        in: query
        description: Фильтрация по городу
        schema:
          type: string
      - name: sort
        in: query
        description: Сортировка коворкингов
        schema:
          type: string
          enum:
          - name_asc
          - name_desc
          - newest
          default: name_asc
      responses:
        '200':
          description: Список коворкингов получен
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                - page
                - limit
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        address:
                          type: string
                        city:
                          type: string
                        description:
                          type: string
                          nullable: true
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '422':
          description: Ошибка валидации параметров
    post:
      tags:
      - Locations
      summary: Создание коворкинга
      description: 'Создаёт новый коворкинг.

        Доступ разрешён только администратору.

        '
      operationId: createLocation
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - address
              - city
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Бизнес-центр
                address:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: ул. Ленина, 10
                city:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Москва
                description:
                  type: string
                  nullable: true
                  example: Современный коворкинг
      responses:
        '201':
          description: Коворкинг успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    minLength: 1
                    maxLength: 255
                    example: Бизнес-центр
                  address:
                    type: string
                    minLength: 1
                    maxLength: 255
                    example: ул. Ленина, 10
                  city:
                    type: string
                    minLength: 1
                    maxLength: 100
                    example: Москва
                  description:
                    type: string
                    nullable: true
                    example: Современный коворкинг
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав администратора
        '422':
          description: Ошибка валидации данных
  /locations/{location_id}:
    get:
      tags:
      - Locations
      summary: Получение информации о коворкинге
      description: 'Возвращает подробную информацию о коворкинге

        по его UUID. Доступен без авторизации.

        '
      operationId: getLocationById
      parameters:
      - name: location_id
        in: path
        required: true
        description: UUID коворкинга
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Информация о коворкинге получена
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - address
                - city
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  address:
                    type: string
                  city:
                    type: string
                  description:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '404':
          description: Коворкинг не найден
        '422':
          description: Некорректный UUID коворкинга
    patch:
      tags:
      - Locations
      summary: Редактирование коворкинга
      description: 'Изменяет данные существующего коворкинга.

        Доступ разрешён только администратору.

        '
      operationId: updateLocation
      security:
      - BearerAuth: []
      parameters:
      - name: location_id
        in: path
        required: true
        description: UUID коворкинга
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                address:
                  type: string
                  minLength: 1
                  maxLength: 255
                city:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Коворкинг успешно обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  address:
                    type: string
                  city:
                    type: string
                  description:
                    type: string
                    nullable: true
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав администратора
        '404':
          description: Коворкинг не найден
        '422':
          description: Ошибка валидации данных
    delete:
      tags:
      - Locations
      summary: Удаление коворкинга
      description: 'Удаляет коворкинг по его UUID.

        Доступ разрешён только администратору.

        Удаление запрещено, если в коворкинге

        существуют помещения.

        '
      operationId: deleteLocation
      security:
      - BearerAuth: []
      parameters:
      - name: location_id
        in: path
        required: true
        description: UUID удаляемого коворкинга
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Коворкинг успешно удалён
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав администратора
        '404':
          description: Коворкинг не найден
        '409':
          description: 'Невозможно удалить коворкинг,

            пока в нём существуют помещения.

            '
        '422':
          description: Некорректный UUID коворкинга
  /rooms:
    get:
      tags:
      - Rooms
      summary: Получение списка помещений
      description: 'Возвращает список активных переговорных

        комнат и рабочих мест.

        Доступен без авторизации.

        Поиск, фильтрация, сортировка и пагинация

        выполняются на сервере.

        '
      operationId: getRooms
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: search
        in: query
        description: Поиск по названию помещения
        schema:
          type: string
      - name: location_id
        in: query
        description: UUID коворкинга
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        description: Тип помещения
        schema:
          type: string
          enum:
          - meeting_room
          - workspace
      - name: min_capacity
        in: query
        description: Минимальная вместимость
        schema:
          type: integer
          minimum: 1
      - name: sort
        in: query
        description: Сортировка помещений
        schema:
          type: string
          enum:
          - name_asc
          - name_desc
          - capacity_asc
          - capacity_desc
          default: name_asc
      responses:
        '200':
          description: Список помещений получен
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                - page
                - limit
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        location_id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        type:
                          type: string
                          enum:
                          - meeting_room
                          - workspace
                        capacity:
                          type: integer
                        image_url:
                          type: string
                          nullable: true
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '422':
          description: Ошибка валидации параметров
    post:
      tags:
      - Rooms
      summary: Создание помещения
      description: 'Создаёт переговорную комнату или рабочее место

        в существующем коворкинге.

        Доступ разрешён только администратору.

        '
      operationId: createRoom
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - location_id
              - name
              - type
              - capacity
              additionalProperties: false
              properties:
                location_id:
                  type: string
                  format: uuid
                  description: UUID коворкинга
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Переговорная №1
                description:
                  type: string
                  nullable: true
                type:
                  type: string
                  enum:
                  - meeting_room
                  - workspace
                capacity:
                  type: integer
                  minimum: 1
                  example: 8
                is_active:
                  type: boolean
                  default: true
                image_url:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Помещение успешно создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  location_id:
                    type: string
                    format: uuid
                    description: UUID коворкинга
                  name:
                    type: string
                    minLength: 1
                    maxLength: 255
                    example: Переговорная №1
                  description:
                    type: string
                    nullable: true
                  type:
                    type: string
                    enum:
                    - meeting_room
                    - workspace
                  capacity:
                    type: integer
                    minimum: 1
                    example: 8
                  is_active:
                    type: boolean
                  image_url:
                    type: string
                    nullable: true
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав администратора
        '422':
          description: Ошибка валидации данных
        '404':
          description: Указанный коворкинг не найден
  /rooms/{room_id}:
    get:
      tags:
      - Rooms
      summary: Получение информации о помещении
      description: 'Возвращает подробную информацию

        о переговорной комнате или рабочем месте.

        Доступен без авторизации.

        '
      operationId: getRoomById
      parameters:
      - name: room_id
        in: path
        required: true
        description: UUID помещения
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Информация о помещении получена
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - location_id
                - name
                - type
                - capacity
                properties:
                  id:
                    type: string
                    format: uuid
                  location_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  type:
                    type: string
                    enum:
                    - meeting_room
                    - workspace
                  capacity:
                    type: integer
                  is_active:
                    type: boolean
                  image_url:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '404':
          description: Помещение не найдено
        '422':
          description: Некорректный UUID помещения
    patch:
      tags:
      - Rooms
      summary: Редактирование помещения
      description: 'Изменяет характеристики переговорной комнаты

        или рабочего места.

        Доступ разрешён только администратору.

        '
      operationId: updateRoom
      security:
      - BearerAuth: []
      parameters:
      - name: room_id
        in: path
