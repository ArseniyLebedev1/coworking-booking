        description: UUID помещения
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                type:
                  type: string
                  enum:
                  - meeting_room
                  - workspace
                capacity:
                  type: integer
                  minimum: 1
                is_active:
                  type: boolean
                image_url:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Помещение успешно обновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  location_id:
                    type: string
                    format: uuid
                    description: UUID коворкинга
