      description: 'Удаляет помещение по его UUID.

        Доступ разрешён только администратору.

        Удаление запрещено, если у помещения

        существуют бронирования.

        '
      operationId: deleteRoom
      security:
      - BearerAuth: []
      parameters:
      - name: room_id
        in: path
        required: true
        description: UUID удаляемого помещения
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Помещение успешно удалено
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав администратора
        '404':
          description: Помещение не найдено
        '409':
          description: Удаление невозможно, поскольку у помещения существуют бронирования
        '422':
          description: Ошибка валидации данных
  /bookings:
    post:
      tags:
      - Bookings
      summary: Создание бронирования
      description: 'Создаёт бронирование помещения.

        Доступно авторизованному сотруднику

        или администратору.

        Сервер запрещает пересечение активных

        бронирований одного помещения.

        '
      operationId: createBooking
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - room_id
              - start_time
              - end_time
              additionalProperties: false
              properties:
                room_id:
                  type: string
                  format: uuid
                start_time:
                  type: string
                  format: date-time
                end_time:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Бронирование создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  room_id:
                    type: string
                    format: uuid
                  user_id:
                    type: string
                    format: uuid
                  start_time:
                    type: string
                    format: date-time
                  end_time:
                    type: string
                    format: date-time
                  status:
                    type: string
                    example: confirmed
        '400':
          description: Некорректный временной интервал
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав
        '404':
          description: Помещение не найдено
        '409':
          description: 'Помещение недоступно или уже

            забронировано на указанное время.

            '
        '422':
          description: Ошибка валидации данных
    get:
      tags:
      - Bookings
      summary: Получение списка бронирований
      description: 'Сотрудник получает только свои бронирования.

        Администратор получает все бронирования.

        Фильтрация, сортировка и пагинация

        выполняются на сервере.

        '
      operationId: getBookings
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: status
        in: query
        schema:
          type: string
          enum:
          - confirmed
          - cancelled
      - name: room_id
        in: query
        schema:
          type: string
          format: uuid
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - start_time_asc
          - start_time_desc
          - newest
          default: start_time_desc
      responses:
        '200':
          description: Список бронирований получен
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                - page
                - limit
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        user_id:
                          type: string
                          format: uuid
                        room_id:
                          type: string
                          format: uuid
                        start_time:
                          type: string
                          format: date-time
                        end_time:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum:
                          - confirmed
                          - cancelled
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '401':
          description: Пользователь не авторизован
        '403':
          description: Недостаточно прав доступа
        '422':
          description: Ошибка валидации параметров

          
  /bookings/{booking_id}:
    get:
      tags:
        - Bookings
      summary: Получение информации о бронировании
      description: |
        Возвращает информацию о бронировании.
        Сотрудник может просматривать только
        собственные бронирования.
